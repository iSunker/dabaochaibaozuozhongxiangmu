# =====================================================================
# 大包拆包 · 单种保种  —— 服务栈
#   prowlarr        : 把你的 PT 站变成 Torznab，供 cross-seed 搜索
#   flaresolverr    : (可选) 过 Cloudflare，中文 NexusPHP 站常需要
#   cross-seed      : 按内容匹配单种 → 在 linkDir 建硬链接 → 注入 :3060
#   reseed-orchestrator : 我们写的编排器(一次性 CLI)，预检/驱动/汇报
#
# 注意：qbittorrent-reseed(:3060) 由它自己的 compose 单独运行，不在本栈内。
#       本栈**接入它所在的 docker 网络**(qbit-net = qbittorrent-reseed_default)，
#       用服务名直连 http://qbittorrent-reseed:3060。
#       ★ 不要改回 http://${NAS_IP}:3060 —— 群晖上「容器 → 宿主机 LAN IP → DNAT 回
#         另一容器」会 timeout（2026-09-11 实测）。
#       （宿主机上跑的 drive-loop.py 走的是另一条路：LAN IP + 端口映射；
#         两边是**故意不同**的，别互相纠正。）
#
# 用法：
#   docker compose up -d prowlarr flaresolverr        # Phase 1
#   docker compose up -d cross-seed                   # Phase 2
#   docker compose build reseed-orchestrator          # Phase 3
#   docker compose run --rm reseed-orchestrator preflight
#   docker compose run --rm reseed-orchestrator run --job frds-top250-2024 --dry-run
#
# ★ 关于 logging（2026-09-12 加）
# ---------------------------------
# 四个服务原先**都没有 logging 段** —— 走 Docker 默认的 json-file 驱动，
# 而它**默认没有任何上限**（除非全局 daemon.json 另配过）。也就是说这些容器会
# 一直往 /volume2/@docker/containers/*/*-json.log 里写、永不清理。
#
# 为什么这条要单独拿出来说：本项目其余日志其实**都已经在自我轮转**——
#   ① drive-loop.log        RotatingFileHandler(5MB × 5)        ≈ 30 MB 上限
#   ② cross-seed/logs/*     按天轮转 + 保留 14 天                ≈ 0.9 GB 稳态
#   ③ notify/log/*.tsv      不清，但一天 137 字节                ≈ 50 KB/年
# 所以**容器日志才是唯一没上限的那个**（NAS 的 /volume1 只剩约 20 GB）。
# 照"给日志加轮转"的直觉去动 ①②，等于做一个**已经存在的东西**。
#
# 10m × 3 = 每个容器上限 30 MB，四个合计 ~120 MB（相对现在的"无上限"是质变）。
# ⚠ 改这里**必须 `--force-recreate` 才生效** —— `restart` 不重新读 compose 配置。
#   sudo docker compose up -d --force-recreate
# 验证：sudo docker inspect --format '{{.HostConfig.LogConfig}}' reseed-cross-seed
# =====================================================================

# 四个服务共用同一份日志上限。★ 用 YAML 锚点（而不是抄四遍）是为了**不会漂移**：
# 以后要调就只改这一处。`x-` 开头的顶层键是 compose 规范允许的扩展字段，会被忽略。
x-logging: &logging-limits
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"


services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: reseed-prowlarr
    env_file: [.env]
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      # ./ = compose 文件所在目录 = /volume2/docker_ssd/prowlarr_cross-seed_autohardlink
      - ./prowlarr:/config
    ports:
      - "9696:9696"
    networks: [reseed-net]
    logging: *logging-limits
    restart: unless-stopped

  # 可选：中文站过 Cloudflare 用；不需要就删掉本段（并去掉 Prowlarr 里的代理设置）
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: reseed-flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
    ports:
      - "8191:8191"
    networks: [reseed-net]
    logging: *logging-limits
    restart: unless-stopped

  cross-seed:
    image: ghcr.io/cross-seed/cross-seed:latest
    container_name: reseed-cross-seed
    # 以媒体属主身份运行，保证建出来的硬链接属主/权限与大包一致
    user: "${PUID}:${PGID}"
    env_file: [.env]
    environment:
      - TZ=${TZ}
      - CONFIG_DIR=/config
      # 供 cross-seed/config.js 读取（见该文件顶部说明）
      # qbittorrent-reseed 在它自己 compose 栈的网络里（qbittorrent-reseed_default）。
      # 本服务已接入该网络(qbit-net)，用服务名直连；不要改回 ${NAS_IP}，群晖上
      # 「容器→宿主机 LAN IP→DNAT 回另一容器」的回环会 timeout（2026-09-11 实测）。
      - QBIT_URL=http://qbittorrent-reseed:3060
      - TORZNAB_URLS=${TORZNAB_URLS}
      - DATA_DIRS=${DATA_DIRS}
      - LINK_DIR=${LINK_DIR}
      - LINK_TYPE=${LINK_TYPE}
      - MATCH_MODE=${MATCH_MODE}
      - SKIP_RECHECK=${SKIP_RECHECK}
      - QBIT_CATEGORY=${QBIT_CATEGORY}
      - CROSSSEED_API_KEY=${CROSSSEED_API_KEY}
    command: daemon
    volumes:
      - ./cross-seed:/config
      # ★大包源数据 + 建链接目录：两者必须在同一物理卷，且此处 1:1 挂载
      - /volume1/video:/volume1/video
    ports:
      - "2468:2468"
    depends_on: [prowlarr]
    networks: [reseed-net, qbit-net]
    logging: *logging-limits
    restart: unless-stopped

  # 一次性 CLI：默认只做只读预检；实际匹配请用 `docker compose run ... run`
  reseed-orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    image: reseed-orchestrator:0.1.0
    container_name: reseed-orchestrator
    user: "${PUID}:${PGID}"
    env_file: [.env]
    environment:
      - TZ=${TZ}
      - NAS_IP=${NAS_IP}
      - RESEED_CONFIG=/config/config.yml
      # `state` 子命令只读的那个 sidecar 状态库（真实位置不在 /config 下，见下）
      - RESEED_STATE_DB=/state/state.db
    volumes:
      # 编排器(autohardlink)的配置目录 = ./hlink；把 config.yml 放进 hlink/ 即可。
      # 注意：这里只放"配置/日志"等元数据，真正的硬链接数据在 LINK_DIR(/volume1/video 下)。
      - ./hlink:/config
      # ★ 2026-09-12 下午加：状态库**不在** /config 里 —— ./hlink 是编排器自己的配置目录
      #   （只有 config.yml），而 drive-loop 真正在写的那份在 <compose>/drive-loop/hlink/。
      #   ★ 挂成 **ro**：`state` 只读；而 StateStore 打开库时会跑一遍 schema 迁移
      #   （`ALTER TABLE ...`），rw 挂载等于让一个"只读"子命令**有写坏生产库的能力**。
      #   ro 把这条可能性直接掐掉，顺带也是给 `state` 的语义做背书。
      - ./drive-loop/hlink:/state:ro
      # 预检要 stat 源目录/校验同卷；prestage 要建链接 → 同样 1:1 挂载媒体卷
      - /volume1/video:/volume1/video
    depends_on: [cross-seed]
    networks: [reseed-net, qbit-net]
    logging: *logging-limits
    restart: "no"

  # ------------------------------------------------------------------ #
  # drive-loop：容器**自带常驻 while 循环**的跑批驱动（`#58`，C 方案）
  #
  #   ★★ 它默认**不会**被 `docker compose up -d` 拉起来 —— 见下面 `profiles`。
  #
  # 它取代了什么
  # ------------
  #   取代「DSM 任务计划每 15 分钟唤醒一次 `drive-loop/run.sh`（带 `--once`）」。
  #   入口是 `drive-loop/run-resident.sh`（仓库里 `scripts/drive-loop-resident.sh`），
  #   **不带** `--once` —— 循环在 python 里，DSM 那侧只管"容器还活着吗"。
  #
  # ★★ 启用前**必须**先在 DSM 里停掉那个跑 `run.sh` 的任务
  # ------------------------------------------------------
  #   两条路**没有任何跨进程互斥**（`§26.5` 前提 ②）：同时发 webhook ⇒
  #   一次 429 可能废掉几百条（README 坑 4）。
  #   ★ 它比"两个同类进程"更隐蔽：**两边写的东西不一样**
  #     （常驻写 `mode=resident`、`--once` 不写 mode）⇒ 改之前从状态文件上
  #     **根本看不出有两个在跑**。`#58` 的 15.a 修复给常驻分支补了 mode 与心跳，
  #     就是为了让这件事**能被看出来**。
  #   ⇒ 启用是**两步**、且**顺序不能倒**：
  #       ① DSM → 控制面板 → 任务计划：停掉「驱动跑批」那条（见 README 部署表）
  #       ② docker compose --profile drive-loop up -d drive-loop
  #   ⇒ `run-resident.sh` 自己还有一道前置闸门（读到"另一条路在跑"就退出，码 3），
  #     但它只是**兜底**：`mode=resident` 时它无法区分"上一轮残留"与"另一个常驻"。
  #     **别把兜底当主闸。**
  #
  # ★ 为什么 `build:` 不写 —— 这条是硬约束
  # ---------------------------------------
  #   本仓的 docker build 上下文是**仓库根**，而 NAS 上的构建上下文是 **compose 目录**
  #   （`docker compose build` 在 NAS 上是从 compose 文件所在目录起步）。两边相对路径
  #   不同 ⇒ 写 `build:` 会在 NAS 上 build 失败。镜像 `reseed-drive-loop:0.1.0` 已在
  #   本机 build 并 `docker load` 到 NAS（`§26.5` 表），**只 load 不 build**。
  #   ★ 同一条约束也记在 `scripts/check-deploy-drift.py` 的 LOCAL_ONLY 里
  #     （`drive-loop.Dockerfile` 那条）。
  #
  # ★ 挂载为什么是**整目录 1:1**、不是挑几个子目录
  # ---------------------------------------------
  #   代码里的路径**全是绝对路径**：`CROSSSEED_DIRS[0]`（硬编码）、
  #   `build-farm.sh` 的 `COMPOSE_DIR`、`--env "$COMPOSE_DIR/.env"`、告警出栈口
  #   `notify/spool/`、以及 `ROOT = HERE.parent` 那条推导。
  #   ⇒ **挑着挂不会报错，只会静默退化**（`first_existing()` 返回 `None` + 一行 warning）。
  #   ★ 最容易漏的是 `drive-loop/scripts/` 下的 `.state` 文件（**不在** `hlink/` 里），
  #     漏了的后果是**静默**的：对账 / 无人认领的基线会被当成「首次读数」重新记一遍。
  #     ★ 2026-09-17 更正：这里原写「**五个**」，**实测是六个** ——
  #       `.daily-report` / `.drive-loop` / `.farm-check` / `.linkguard` / `.notify` / `.reconcile`。
  #       其中 `.linkguard.state` 最大（约 **827 KB**，那是基线本身）。
  #       ⇒ 清单以 `scripts/chk58.sh` 的 `[3]` 段为准（它会逐个点名 + 报字节数）。
  #
  # ★★ 爆炸半径（写明，不是没看见）
  # -----------------------------
  #   挂整个 compose 目录 = 把 `.env`、`prowlarr/`（cookie + db）、
  #   `cross-seed/`（含 API key）、`notify/notify.conf`（邮箱口令）一并交给这个容器。
  #   **躲不掉**（要 1:1 就必然如此）。`profiles` 锁把"什么时候交出去"变成人的决策，
  #   但**不能**减小半径。
  #
  # ★ 用户与属主：**不加 `user:`**（与另外三个服务不同，这是刻意的）
  # -------------------------------------------------------------
  #   宿主那份 `run.sh` 由 DSM 以 **root** 跑 ⇒ 它写下的 `.drive-loop.state`、
  #   `attempts.log`、`drive-loop.log` 属主都是 root。容器这边若切成 `${PUID}:${PGID}`，
  #   同一个文件就会**两个属主换来换去**，其中一边必然写不进去。
  #   ⇒ 两边**同为 root**，一致。（`drive-loop-docker.sh` 头部"还没验的三件事 ③"记的就是这条。）
  #   ★ 代价：容器里跑的代码是 root。它的动作面是 `--url`/`--qbit-url`（HTTP）+
  #     写 `$COMPOSE_DIR` 与 `/volume1/video` 下的文件（建硬链接、农场目录）。
  #     这些**本来**就在 root 的权限下发生（宿主那份也是 root），所以这不是**新增**权限，
  #     只是把同一权限挪了个地方。
  #
  # ★ 网络要**两个** —— 和 `cross-seed` 同形，别猜网络名
  # ------------------------------------------------
  #   `cross-seed` / `prowlarr` 在 `reseed-net`；`qbittorrent-reseed` 在 `qbit-net`
  #   （=`qbittorrent-reseed_default`，external）。两条缺一不可：
  #   少了 reseed-net 连不上 `cross-seed:2468`，少了 qbit-net 连不上
  #   `qbittorrent-reseed:3060`。★ 别改成 `${NAS_IP}` —— 群晖上
  #   「容器 → 宿主机 LAN IP → DNAT 回另一容器」会 timeout（README 坑 4）。
  #
  # ★ 接线与迁移状态：README「还没做」第 15 条 + `summary/26-...md` §26.5
  # ------------------------------------------------------------------ #
  drive-loop:
    image: reseed-drive-loop:0.1.0
    container_name: reseed-drive-loop
    # ★★ 「生效但不自动上线」的安全锁（`#58` 的 15.a 修复之外的第二条前提）。
    #   带 profile 的服务，`docker compose up -d` **默认不启动**；
    #   必须 `docker compose --profile drive-loop up -d drive-loop`。
    #   ⇒ 于是：代码就绪、进白名单、`deploy.sh` 会推，但**不会被任何人顺手拉起来**。
    #     要启用必须显式打那条命令 —— 而那一步的前置是**先在 DSM 里停掉 run.sh 任务**。
    #   ★ profile 名与 service 名同名**是巧合**：它的语义是
    #     「**这是需要人工显式决策的第二条路**」，不是分类标签。
    #   ★ 不给别的服务加 profile（否则它们会被一起锁住，那是另一种事故）。
    profiles: ["drive-loop"]
    # 常驻服务 —— 同 `cross-seed`。
    # ★ 它只对**退出**生效。**「卡死」（进程活着、不干活）不触发它** ——
    #   那种情形靠下面 `healthcheck` + `autoheal` 侧车（2026-09-17 已加）。
    restart: unless-stopped
    # ★★ healthcheck：判据取**心跳新鲜度**（15.a 修好的 `.drive-loop.state` 的
    #   `heartbeat_ts`）。这是本仓**第一个** healthcheck。
    #   ★ 为什么用 python 而不是 sed/grep 抠 JSON：镜像就是 python:3.12-slim
    #     （python 一定在），而本仓**踩过一次**「sed 抠 JSON 静默抠错」
    #     （`drive-loop-resident.sh` 闸门里那句注释），且 `tests/README.md`
    #     有「**别让判据需要转义**」这条。
    #   ★★ 阈值 900s **故意比 `batch_alive()` 的 `HEARTBEAT_STALE_SEC`(600s) 松**：
    #     healthcheck ⇒ 要不要**重启容器**（重动作，宁晚不误杀）；
    #     `batch_alive` ⇒ 要不要**跳过本轮**（轻动作）。两者权衡方向不同。
    #   ★★ `start_period: 120s` **必须有**：容器刚起来时状态文件还没写，
    #     判据会失败 ⇒ 没有它则开局即判 unhealthy ⇒ 被 autoheal **反复重启**。
    #   ★ 这条判据**查不出**「容器从没起来过」：那种情形 `docker ps` 的 STATUS
    #     会说话（见 README 15.d 的收尾核对），不由 healthcheck 负责。
    healthcheck:
      test: ["CMD", "python", "-c",
             "import json,sys,time;st=json.load(open(sys.argv[1],encoding='utf-8'));hb=float(st.get('heartbeat_ts') or 0);sys.exit(0 if hb and time.time()-hb<=900 else 1)",
             "/volume2/docker_ssd/prowlarr_cross-seed_autohardlink/drive-loop/scripts/.drive-loop.state"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    # ★★ 这个 label 是 **autoheal 侧车的唯一作用域开关** —— 没有它，
    #   下面那个容器**不会**管 `drive-loop`（autoheal 默认只治带此 label 的容器）。
    labels:
      - autoheal=true
    env_file: [.env]
    environment:
      - TZ=${TZ}
      # 容器方言 ①：镜像里没有 /usr/bin/python3（那是 DSM 自带的），python 在 PATH 上
      - PY=python
      # 容器方言 ②：镜像里没有 sudo，而 build-farm.sh 用 `${SUDO-sudo}` ——
      #   给空串它就跳过 sudo 直接跑（那步本来也 `|| true`）
      - SUDO=
    volumes:
      # ① compose 目录，**同名同路径**（见上面「挂载为什么是整目录 1:1」）
      #    ★ 用绝对路径字面量，**不用 `./`** —— `./` 解析到容器内不存在的宿主路径，
      #      而这里要求两边**逐字相同**。
      - /volume2/docker_ssd/prowlarr_cross-seed_autohardlink:/volume2/docker_ssd/prowlarr_cross-seed_autohardlink
      # ② 媒体卷，同理必须同名同路径；而且 **§9：硬链接不能跨卷** ⇒
      #    农场与源数据必须同一条设备，所以这个挂载**只能是整卷**
      - /volume1/video:/volume1/video
    # ★★ 这里必须是 `entrypoint:`，**不是 `command:`** —— 2026-09-17 实测踩过：
    #   镜像的 `ENTRYPOINT ["python", "/app/scripts/drive-loop.py"]` **不会被 command 覆盖**
    #   （`command:` 只替换 **CMD**）⇒ 写成 `command: ["sh", "...run-resident.sh"]` 时，
    #   实际执行的是
    #       python /app/scripts/drive-loop.py sh drive-loop/run-resident.sh
    #   ⇒ argparse 报 `unrecognized arguments: sh drive-loop/run-resident.sh`
    #   ⇒ 退出码 2 ⇒ 被 `restart: unless-stopped` **每 ~10 秒重启一次**，
    #     而 attempts.log 里 **`[resident]` 一行都不写**（根本没跑到那个脚本）。
    #   ★ 症状极像"路径不对"，其实**是 ENTRYPOINT 没被覆盖** —— 先看 `docker logs`。
    #   ★ 对照：`reseed-orchestrator` 用的是 `command: daemon`，那**是对的** ——
    #     它的 entrypoint 是 `python -m orchestrator.main`，`daemon` 是**子命令参数**；
    #     而这里要的是**整条替换**，所以用 `entrypoint:`。
    #
    # ★ 路径写成**绝对**的：镜像的 `WORKDIR` 是 `/app`，相对路径 `drive-loop/…`
    #   在 `/app` 下**不存在**。挂载点是 1:1 同名同路径 ⇒ NAS 路径 == 容器内路径。
    entrypoint: ["sh", "/volume2/docker_ssd/prowlarr_cross-seed_autohardlink/drive-loop/run-resident.sh"]
    networks: [reseed-net, qbit-net]
    logging: *logging-limits

  # ------------------------------------------------------------------ #
  # autoheal：**卡死接管**侧车（`#58`，2026-09-17 加）
  #
  #   为什么必须有它（而不是"配个 healthcheck 就完事"）
  #   ------------------------------------------------
  #   `restart: unless-stopped` 只对容器**退出**生效。**卡死**（进程活着、
  #   心跳停了、但不退出）**不会**触发任何重启 ⇒ 得有人看着 `unhealthy` 并动手。
  #   Docker 自己没有这个能力 ⇒ 要么这个侧车，要么 DSM 轮询 `docker inspect`。
  #   ★ 15.a 把 `heartbeat_ts` 补上之后，**判据才存在**（之前没有它可判）。
  #
  # ★★ 为什么带 `profiles`（**与 drive-loop 同一个**）
  # ------------------------------------------------
  #   不带 ⇒ `docker compose up -d` 会**单独**把它拉起来，而它要治的容器
  #   （`drive-loop`）**还没启用** ⇒ 一个空转的、**握着 docker.sock** 的容器。
  #   带上同一个 profile ⇒ **两者同生同死**，启用仍是那一条显式命令：
  #       docker compose --profile drive-loop up -d drive-loop autoheal
  #
  # ★★ 爆炸半径（这是本次**最大的新增风险**，写明不是没看见）
  # ------------------------------------------------
  #   `/var/run/docker.sock` ≈ **root 等价** —— 挂它的容器能创建/删除/exec
  #   **任何**容器。★ 本仓此前**没有任何东西**挂过这个 socket（我 grep 过）。
  #   缓解三条，缺一不可：
  #     ① 挂成 **`:ro`**（只读挂载 —— autoheal 只需读状态 + 发 restart 请求）；
  #     ② `AUTOHEAL_CONTAINER_LABEL=autoheal` ⇒ **只治带了那个 label 的容器**，
  #        即**只有 `drive-loop` 一个**（不是"治好一切"）；
  #     ③ `profiles` 锁 ⇒ 它的生命周期由人的显式决策决定。
  #   ★ 代价仍然写着：**它一旦起来，就能碰这台 NAS 上的所有容器。**
  #
  # ★ 镜像标：`willfarrell/autoheal:latest`
  #    ★★ 本机（Windows，写这个文件时）**无法联网核实**该 tag 与那几个 env 的
  #      默认值 —— 所以**这一条是待验的**。落地时先在有网的机器 / NAS 上跑
  #      一下 `docker pull willfarrell/autoheal:latest`（或 `docker manifest inspect`）
  #       确认标存在，再把**实测到的 tag 与 digest 写回这里**。
  #    ★ NAS 能拉镜像（`ghcr.io/flaresolverr/flaresolverr:latest` 成功拉过 12 层，
  #      见 README），所以走 `docker compose` 时它会自动拉，不需要手工 `docker load`。
  # ------------------------------------------------------------------ #
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: reseed-autoheal
    profiles: ["drive-loop"]
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # ★ 作用域：只治带 `autoheal=true` label 的容器（= 只有 drive-loop）
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      # 巡检间隔（秒）；30s 足够，不必更快
      - AUTOHEAL_INTERVAL=30
      # 启动后先等一会儿再开始判 —— 与上面 healthcheck 的 start_period 同理
      - AUTOHEAL_START_PERIOD=120
    volumes:
      # ★ 只读挂载（见上面「爆炸半径」）。★ 路径用字面量 /var/run/docker.sock：
      #   群晖上它就是这个位置（不是 /run/docker.sock）。
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [reseed-net]
    logging: *logging-limits

networks:
  reseed-net:
    driver: bridge
  # qbittorrent-reseed 由它自己的 compose 栈创建的网络，这里以 external 接入，
  # 使 cross-seed / 编排器能用服务名直连 :3060（源 IP 为 172.x，已被 qB 的
  # AuthSubnetWhitelist 172.16.0.0/12 覆盖）。
  qbit-net:
    external: true
    name: qbittorrent-reseed_default
